<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文件轮盘</title>
<style>
  :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
  body { max-width: 620px; margin: 30px auto; padding: 0 22px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  h2 { font-size: 17px; }
  p { line-height: 1.6; }
  section { border-top: 1px solid #80808055; margin-top: 22px; padding-top: 12px; }
  button { font: inherit; padding: 6px 11px; border-radius: 6px; border: 1px solid #80808088; cursor: pointer; }
  li { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
  li span { flex: 1; overflow-wrap: anywhere; }
  ul { padding: 0; }
  #status { min-height: 1.6em; }
  .reminder-entry { display: flex; flex-wrap: wrap; gap: 8px; }
  .reminder-entry input { font: inherit; padding: 7px; }
  #name { flex: 1; min-width: 180px; }
  #rows article { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #80808055; }
  #rows article span { flex: 1; overflow-wrap: anywhere; }
  #rows small { display: block; }
</style>
<main id="wheel-settings">
<h1>轮盘设置</h1>
<button id="start">启动监听</button>
<button id="stop">停止监听</button>
<button id="open-reminders" type="button">打开提醒</button>
<label><input type="checkbox" id="startup"> 登录 Windows 时启动</label>

<section>
  <h2>轮盘目录</h2>
  <p>自动推荐常用文件夹，手动添加的目录优先显示。</p>
  <button id="add">添加文件夹</button>
  <ul id="folders"></ul>
</section>
<p id="status" role="status"></p>
</main>
<main id="wheel-reminders" hidden>
  <button id="back-to-wheel" type="button">返回轮盘设置</button>
  <h1>提醒</h1>
  <form id="entry" class="reminder-entry">
    <input id="name" placeholder="要提醒什么？" aria-label="任务名称" required maxlength="300">
    <input id="at" type="datetime-local" aria-label="提醒时间" required>
    <button type="submit">保存</button>
  </form>
  <p><button id="minute">1 分钟后</button> <button id="reset">清空输入</button> <button id="refresh">刷新清单</button></p>
  <p id="msg" role="status"></p>
  <div id="rows"></div>
</main>
<script src="taskbell/ui.js"></script>
<script src="settings.js"></script>
</html>
